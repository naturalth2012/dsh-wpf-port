name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    # Dsh.Wpf and Dsh.Viewer target net8.0-windows (WPF + WebView2), so the
    # build must run on Windows. A Linux runner cannot compile them.
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore dsh-wpf-port.slnx

    - name: Build
      run: dotnet build dsh-wpf-port.slnx --configuration Release --no-restore

    # Test only the three test projects explicitly. Running `dotnet test dsh-wpf-port.slnx`
    # pulls Dsh.Wpf into the VSTest target's dependency graph and on some runners its
    # `VSTest` target can fail with exit code 1 / 0 errors / 0 warnings (a known msbuild
    # symptom when the WPF host project's IsTestProject=false but the test target is
    # still evaluated). Restricting to the test projects avoids that false negative.
    - name: Test
      run: |
        dotnet test Dsh.Contract.Tests/Dsh.Contract.Tests.csproj --configuration Release --no-build --verbosity normal
        dotnet test Dsh.App.Tests/Dsh.App.Tests.csproj        --configuration Release --no-build --verbosity normal
        dotnet test Dsh.Viewer.Tests/Dsh.Viewer.Tests.csproj  --configuration Release --no-build --verbosity normal
